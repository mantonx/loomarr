  /v1/readyz:
    get:
      description: Public, no credential. 200 when the store is up and migrations are applied, 503 with a reason otherwise — a container started without DATABASE_URL is a SUPPORTED degraded mode, and this is how it explains itself. Also served at `/readyz`.
      operationId: readyz
      responses:
        "200":
          content:
            application/json:
