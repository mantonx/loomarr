      tags:
        - channels
        - suggestions
  /v1/channels/{id}/timeline:
    get:
      description: The current programme, the next few, and the commercial breaks between them, from internal playout's guide (§9.1 V47) — each with episode/series detail and a TMDB preview image. Feeds the Watch player's mini-guide scrubber. Read-only — any authenticated user (viewer-facing).
