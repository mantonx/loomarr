  /v1/filler:
    get:
      description: Filter by kind/era/audience/category, search across name/brand/on-screen-text/tags, sort, and page (§10 V51d). ⚠ **Paged by default — `limit` is 100 and caps at 500.** The unbounded read this replaced hard-fails past ~65k clips on Postgres (one bind parameter per clip in the tag batch, against a 65535-parameter statement cap). `total` is the number MATCHING THE FILTER, counted in SQL through the same predicate as the rows, so a pager can say 'showing 61-120 of 1,204' without the two disagreeing. Held clips and composites are excluded unless asked for, because neither is in the playable catalog.
      operationId: list-filler
      parameters:
        - explode: false
          in: query
          name: kind
          schema:
            enum:
              - commercial
              - bumper
              - station_id
              - psa
              - trailer
              - interstitial
            type: string
        - explode: false
          in: query
          name: era
          schema:
            format: int64
            type: integer
        - explode: false
          in: query
          name: audience
          schema:
            enum:
              - kids
              - family
              - general
              - late_night
            type: string
        - explode: false
          in: query
          name: category
          schema:
            type: string
        - explode: false
          in: query
          name: geographicScope
          schema:
            enum:
              - unknown
              - national
              - local
            type: string
        - explode: false
          in: query
          name: country
          schema:
            maxLength: 2
            minLength: 2
            type: string
        - explode: false
          in: query
          name: market
          schema:
            type: string
        - description: Match clips carrying this taxon directly or through a descendant rollup
          explode: false
          in: query
          name: taxon
          schema:
            description: Match clips carrying this taxon directly or through a descendant rollup
            type: string
        - description: Only playable clips with no directly asserted taxonomy tags on any axis
          explode: false
          in: query
          name: unclassified
          schema:
            description: Only playable clips with no directly asserted taxonomy tags on any axis
            type: boolean
        - description: Only playable clips without a directly asserted taxonomy tag on this axis; absence may be valid for sparse cue axes
          explode: false
          in: query
          name: withoutAxis
          schema:
            description: Only playable clips without a directly asserted taxonomy tag on this axis; absence may be valid for sparse cue axes
            enum:
              - product
              - format
              - seasonal
              - audience-cue
            type: string
        - description: Only commercials missing match tags
          explode: false
          in: query
          name: untagged
          schema:
            description: Only commercials missing match tags
            type: boolean
        - description: Case-insensitive substring match across name, brand, on-screen text and tags (§10 V51d)
          explode: false
          in: query
          name: q
          schema:
            description: Case-insensitive substring match across name, brand, on-screen text and tags (§10 V51d)
            type: string
        - description: "Also search the transcript. Opt-in: it is kilobytes per clip and matches inside words."
          explode: false
          in: query
          name: searchTranscript
          schema:
            description: "Also search the transcript. Opt-in: it is kilobytes per clip and matches inside words."
            type: boolean
        - description: Page size (§10 V51d). Capped at 500 — the unbounded read this replaced hard-fails past ~65k clips on Postgres.
          explode: false
          in: query
          name: limit
          schema:
            default: 100
            description: Page size (§10 V51d). Capped at 500 — the unbounded read this replaced hard-fails past ~65k clips on Postgres.
            format: int64
            maximum: 500
            minimum: 1
            type: integer
        - description: Rows to skip. Use with total to render 'showing 61-120 of 1,204'.
          explode: false
          in: query
          name: offset
          schema:
            description: Rows to skip. Use with total to render 'showing 61-120 of 1,204'.
            format: int64
            minimum: 0
            type: integer
        - description: Sort key; default is the historical path order. Every ordering is made total by a hash tie-break (§10 V51d).
          explode: false
          in: query
          name: sort
          schema:
            description: Sort key; default is the historical path order. Every ordering is made total by a hash tie-break (§10 V51d).
            enum:
              - name
              - duration
              - added
              - plays
              - confidence
            type: string
        - description: Sort direction; default ascending.
          explode: false
          in: query
          name: order
          schema:
            description: Sort direction; default ascending.
            enum:
              - asc
              - desc
            type: string
        - description: Include clips awaiting review (§10 V38). They are excluded by default because they are not in the playable catalog.
          explode: false
          in: query
          name: includeHeld
          schema:
            description: Include clips awaiting review (§10 V38). They are excluded by default because they are not in the playable catalog.
            type: boolean
        - description: Include composites — recorded breaks, which are NOT airable (§10 V45). The catalog listing pairs this with topLevel to render them as containers.
          explode: false
          in: query
          name: includeComposites
          schema:
            description: Include composites — recorded breaks, which are NOT airable (§10 V45). The catalog listing pairs this with topLevel to render them as containers.
            type: boolean
        - description: Only clips with no parent, so a break paginates as one container row instead of the twenty adverts inside it (§10 V51d).
          explode: false
          in: query
          name: topLevel
          schema:
            description: Only clips with no parent, so a break paginates as one container row instead of the twenty adverts inside it (§10 V51d).
            type: boolean
        - description: Load the segments split out of this composite (§10 V45). Takes precedence over topLevel, which it contradicts by construction.
          explode: false
          in: query
          name: parentHash
          schema:
            description: Load the segments split out of this composite (§10 V45). Takes precedence over topLevel, which it contradicts by construction.
            type: string
        - description: Resolve exactly these clip hashes (§10 V51d) — the batch read behind 'name these N pinned clips'. Repeat the parameter per hash. Unknown hashes are simply absent.
          explode: true
          in: query
          name: hashes
          schema:
            description: Resolve exactly these clip hashes (§10 V51d) — the batch read behind 'name these N pinned clips'. Repeat the parameter per hash. Unknown hashes are simply absent.
            items:
              type: string
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List filler clips
      tags:
        - filler
