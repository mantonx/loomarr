    ClipDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ClipDTO.json
          format: uri
          readOnly: true
          type: string
        aiTagged:
          type: boolean
        airDate:
          description: Grounded broadcast date in YYYY-MM-DD form
          type: string
        assertedTags:
          description: Directly asserted taxonomy tags; excludes derived rollups and is the set clip editors should round-trip
          items:
            type: string
          type: array
        audience:
          enum:
            - kids
            - family
            - general
            - late_night
            - ""
          type: string
        brand:
          description: The advertiser, when it appears literally in a text or visual signal (§10 V44). Absent means no GROUNDED brand — never inferred.
          type: string
        category:
          description: Derived primary product-leaf tag; the full set is in tags (§10 V45a)
          type: string
        confidence:
          description: Tagging confidence 0-100; 0 = never scored (§10 V38), which is distinct from a low score
          format: int64
          type: integer
        country:
          description: ISO 3166-1 alpha-2 country when grounded
          type: string
        durationMs:
          format: int64
          type: integer
        era:
          format: int64
          type: integer
        geographicScope:
          enum:
            - unknown
            - national
            - local
          type: string
        geographyEvidence:
          description: Literal source evidence or operator attribution
          type: string
        hasTranscript:
          description: Whether a transcript exists (§10 V44). The text itself is a detail-surface read — kilobytes per clip that no grid renders.
          type: boolean
        hash:
          type: string
        held:
          description: Waiting for review in Incoming, not in the playable catalog (§10 V38). Only ever true when includeHeld or heldOnly was passed.
          type: boolean
        hoverImage:
          $ref: "#/components/schemas/ImageDTO"
          description: Image-service record for the hover loop; absent until adopted, or when no animation was rendered
        isComposite:
          description: A recorded break (many ads in one file), not airable — render as a container whose segments are the airable clips (§10 V45)
          type: boolean
        kind:
          enum:
            - commercial
            - bumper
            - station_id
            - psa
            - trailer
            - interstitial
          type: string
        language:
          description: Absent = not yet checked; 'none' = checked and wordless; otherwise the detected language (§10 V40). The first two are different facts.
          type: string
        lastPlayedAt:
          description: RFC3339; absent if never played (or not counted)
          type: string
        license:
          description: The licence URL the source declared. ⚠ Absent means UNKNOWN, never public domain — most archive.org items declare none.
          type: string
        market:
          description: Local broadcast market when geographicScope is local
          type: string
        name:
          type: string
        network:
          type: string
        parentHash:
          description: The composite this clip was split from; absent for a non-segment clip (§10 V45)
          type: string
        playCount:
          format: int64
          type: integer
        playsCounted:
          description: False when this install cannot observe airings (Tunarr-backed playout) — render as 'not counted', not as 0
          type: boolean
        quality:
          description: Resolution label from the probed video height (1080p, 480p). Display-only by default; affects selection only when the filler.min_quality floor is set, which is off unless an operator turns it on.
          type: string
        source:
          type: string
        station:
          type: string
        suggestedEra:
          description: AI-proposed era NOT persisted as a tag because the year is absent from the clip's text signals (§10). Confirm by PATCHing era; 0 = no suggestion.
          format: int64
          type: integer
        tagged:
          description: Whether the clip has all match tags (era+audience+category)
          type: boolean
        tags:
          description: The clip's taxonomy tags (leaf + rolled-up ancestors); category is the derived primary product leaf (§10 V45a)
          items:
            type: string
          type: array
        thumbImage:
          $ref: "#/components/schemas/ImageDTO"
          description: Image-service record for the still; absent until the adoption job has run, or when no frame was extracted
        tunarrProgramId:
          type: string
        visionTagged:
          description: A vision pass over keyframes contributed tags, distinct from aiTagged (text-only) (§10 V44)
          type: boolean
      required:
        - hash
        - name
        - kind
        - durationMs
        - playCount
        - playsCounted
        - aiTagged
        - tagged
      type: object
