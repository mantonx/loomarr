            description: Words to search for, e.g. "1980s cereal commercial". When collection is also present, searches within that collection.
            minLength: 2
            type: string
        - description: "An archive.org collection to list or search: a URL, a /details/<id> path, or a bare identifier. May be combined with q to search within it."
          explode: false
          in: query
          name: collection
          schema:
            description: "An archive.org collection to list or search: a URL, a /details/<id> path, or a bare identifier. May be combined with q to search within it."
            type: string
        - description: Max results (default 25)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results (default 25)
            format: int64
            maximum: 25
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Search archive.org for clips to add
      tags:
        - filler
  /v1/filler/discover/stats:
    get:
      description: "Admin only (§10, V35). Fills in the duration and quality a search deliberately omits. ⚠ This is ONE UPSTREAM CALL PER ID and archive.org is slow (median 1.8s, and it gets slower if asked for more at once), so send only the ids currently on screen — a full page of 25 measured 22.6s. An id archive.org cannot answer for is ABSENT from the response rather than zero: 0 would be indistinguishable from a genuinely empty clip."
      operationId: discover-filler-stats
      parameters:
        - description: Result ids to describe. Repeat the parameter per id (?id=a&id=b).
          explode: true
          in: query
          name: id
          required: true
          schema:
            description: Result ids to describe. Repeat the parameter per id (?id=a&id=b).
            items:
              type: string
            maxItems: 25
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverStatsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Runtime and quality for specific search results
      tags:
        - filler
  /v1/filler/file:
    post:
      description: "Admin only (§10 V38). Admits held clips to the playable catalog — they become matchable into pods. With `asSuggested`, each clip's OWN ungrounded era guess is confirmed as it files (the mock's \"File all as suggested\"), which `bulk/tag` cannot express because it applies one era to the whole selection. Filing by hand CLEARS the auto-filed marker: a human looked."
      operationId: file-filler-clips
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: File held clips into the catalog
      tags:
        - filler
  /v1/filler/fit:
    get:
      description: "The override picker's per-channel note (§10 V35). For every channel: which rung of the §10 ladder this clip would be drawn from, or WHY it would never be picked, plus the operator's pin/exclude state. Computed from the SAME predicates assembly uses, through the same per-channel selection as the pod preview — a note that disagrees with what airs is a confident wrong answer about why a channel looks the way it does. Read-only. ⚠ A PINNED clip reports no rung and no reason: a pin is placed ahead of the ladder, so it has none. ⚠ Every channel is listed, including paused ones — pinning to a paused channel is a decision that takes effect when it resumes."
      operationId: clip-channel-fit
      parameters:
        - description: The clip's path (its identity, §10)
          explode: false
          in: query
          name: clip
          required: true
          schema:
            description: The clip's path (its identity, §10)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipFitOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Where this clip lands on each channel's ladder
      tags:
        - filler
        - channels
  /v1/filler/hold:
    post:
      description: "Admin only (§10 V38). The undo for auto-filing: a clip Loomarr filed without asking goes back to Incoming and stops being matched into pods. ⚠ It does NOT remove the clip or touch the file — that is \"Remove from catalog\", a different action with a different promise."
      operationId: hold-filler-clips
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Send clips back to the review queue
      tags:
        - filler
  /v1/filler/incoming:
    get:
      description: Admin only (§10 V35) — the Filler page's Incoming tab. One bounded read for the clip conveyor, reviewable reels, rejected clips, and recently auto-filed clips. Each list carries its full total so a large import cannot make the response unbounded or make the badge report only the first page.
      operationId: filler-incoming
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillerIncomingOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What has been downloaded but isn't filed yet
      tags:
        - filler
  /v1/filler/ingest:
    post:
      operationId: ingest-filler
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download clips into the drop-folder (admin; needs the vendored yt-dlp + ffmpeg)
      tags:
        - filler
  /v1/filler/media/{hash}:
    get:
      description: Any authenticated user. The clip itself, so an operator can watch one before deciding about it. Range-capable, so a <video> element can seek. The exact media type comes from a short server-side allowlist keyed by extension.
      operationId: filler-media
      parameters:
        - description: The clip's content hash (from ClipDTO)
          in: path
          name: hash
          required: true
          schema:
            description: The clip's content hash (from ClipDTO)
            examples:
              - 9f2b1c4e8a7d6503
            type: string
      responses:
        "200":
          content:
            audio/*:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
            video/*:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The clip's own bytes.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: A clip's own bytes
      tags:
        - filler
  /v1/filler/pool:
    get:
      description: How well the catalog can fill breaks across the whole install (§10 V35) — the Filler page's pool strip. Counts what exists (clips, commercials, duration-eligible, untagged) and lists every live channel's coverage, WORST FIRST. The per-channel answers are the SAME `Coverage` computation `/v1/channels/{id}/filler/coverage` returns, called once per channel, so this page and the channel page cannot disagree — there is no aggregate ladder to drift from the real one. Read-only, so any authenticated user may call it.
      operationId: filler-pool
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Catalog-wide filler health
      tags:
        - filler
  /v1/filler/pulls:
    get:
      description: Admin only (§10 V35). `status` filters (pending | approved | dismissed); omit it for all. Decided pulls are KEPT — the queue's History answers what was agreed to and who said so.
      operationId: list-filler-pulls
      parameters:
        - description: Omit for all
          explode: false
          in: query
          name: status
          schema:
            description: Omit for all
            enum:
              - pending
              - approved
              - dismissed
              - ""
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFillerPullsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List pulls awaiting a decision
      tags:
        - filler
    post:
      description: "Admin only (§10 V35). Composes a plan across the ENABLED filler sources and writes it to the approval queue. ⚠ **Downloads nothing** — that is the whole point: the machine proposes, a human commits. Refused with 409 when every source the plan would need is switched off, naming the switch to flip rather than writing a pull that could never run."
      operationId: propose-filler-pull
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeFillerPullInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Propose a pull
      tags:
        - filler
  /v1/filler/pulls/{id}/approve:
    post:
      description: "Admin only (§10 V35). THE gate: this is the only path on which a pull downloads anything, and it enqueues through the EXISTING ingest job rather than a route of its own. The body carries the operator's edits — rows dropped, and a note narrowing what to fetch. Dropped rows are recorded, not erased. Approving an already-decided pull is a 409, so a double-click cannot enqueue twice."
      operationId: approve-filler-pull
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveFillerPullInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a pull — the commit point
      tags:
        - filler
  /v1/filler/pulls/{id}/dismiss:
    post:
      description: Admin only (§10 V35). Records the decision and downloads nothing. The row is kept.
      operationId: dismiss-filler-pull
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Decline a pull
      tags:
        - filler
  /v1/filler/readiness:
    get:
      description: One server-owned operational projection across acquisition limits, durable runs, pipeline ownership, playable inventory, and worst-first channel coverage (§10 V59). Clients render the typed next action rather than reconstructing priorities from counters.
      operationId: filler-readiness
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillerReadinessDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Filler readiness and next action
      tags:
        - filler
  /v1/filler/retry:
    post:
      description: Admin only. Retries one or a bounded set of execution failures at the server-selected failed stage, preserving completed upstream work. Content decisions use restore instead.
      operationId: retry-filler-failures
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryFillerFailuresInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryFillerFailuresOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Retry eligible ingest failures
      tags:
        - filler
  /v1/filler/rewind:
    post:
      description: Admin only. Resets the selected stage and every later stage, durably forces the selected stage to run, and invalidates only derived data safe for that stage to replace. Re-running transcode requires force because the original bytes are no longer available and another encode loses quality.
      operationId: rewind-filler-clip
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewindFillerClipInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Re-run a clip's ingest pipeline from one stage
      tags:
        - filler
  /v1/filler/sources:
    get:
      description: Admin only. Derived from the configured drop-folder and library scan plus live per-source clip counts — there is no sources table (§10). A source the install could use but has not configured is returned with configured:false rather than omitted.
      operationId: list-filler-sources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillerSourcesOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Where the clip catalog comes from
      tags:
        - filler
    post:
      description: Admin only (§10 V35/V38b). Registers a source for search, pulls, and bounded scheduled acquisition. Registration itself only records the source; enabled remote sources are downloaded on their configured schedule, while composed multi-source pulls retain their approval gate.
      operationId: add-filler-source
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFillerSourceInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteSourceDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Register a remote collection to pull filler from
      tags:
        - filler
  /v1/filler/sources/fetch:
    post:
      description: Admin only (§10 V56). Runs one ordinary bounded acquisition pass for the selected source, then scans configured local sources. Omit id for the backward-compatible all-source pass. It retains enable checks, deduplication and safety limits; this is not an unbounded bypass.
      operationId: fetch-filler-source
      parameters:
        - description: Registered source id to refresh; omit to run all enabled sources
          explode: false
          in: query
          name: id
          schema:
            description: Registered source id to refresh; omit to run all enabled sources
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchFillerSourceOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Fetch and scan filler now
      tags:
        - filler
  /v1/filler/sources/{id}:
    delete:
      description: Admin only (§10 V35). ⚠ Clips it already brought in are NOT deleted — they are real files, already tagged and possibly pinned into a channel, and forgetting where something came from is not a reason to throw it away. Only the registered remotes can be deleted; the derived folder and library rows describe configuration, which is changed in Settings.
      operationId: delete-filler-source
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Forget a registered remote collection
      tags:
        - filler
    patch:
      description: "Admin only (§10 V35, extended V38c/V57). Off means Loomarr stops scanning, searching and downloading from this source. ⚠ It does NOT remove clips already in the catalog, and it is not a delete: the source keeps its licence and fetch history, so switching it back on resumes rather than restarts. `autoAdmit` is separate: when true, only grounded clips that pass the global confidence gate may be filed without review. `folder` writes the drop-folder setting; any other id writes that source's own row. ⚠ `fetchEverySeconds` is three-state — omit or send null to inherit the global, 0 to never auto-fetch this source, or a positive number of seconds. Library sources became switchable in V38c, when §10 restored them to being scanned."
      operationId: set-filler-source-enabled
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFillerSourceEnabledInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetFillerSourceEnabledOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Control source acquisition, admission, and fetch cadence
      tags:
        - filler
  /v1/filler/split:
    post:
      description: "Admin only (§10, V34). The clip is identified by `path` in the body (§10 V45a). Runs detection — chapters → blackdetect/silencedetect → transcript rescue for over-long segments — as a background job (progress on /v1/events as filler_split frames), producing a PERSISTED split proposal. Nothing enters the catalog: review is not optional, because detection quality is a property of the source."
      operationId: split-filler
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SplitFillerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Propose splits for a compilation clip
      tags:
        - filler
  /v1/filler/split-operations/{jobId}:
    get:
      description: Admin only. Authoritative reconnect state for the jobId returned by POST /v1/filler/split. A successful operation carries the proposalId to read from /v1/filler/splits/{proposalId}; SSE is latency-only.
      operationId: get-filler-split-operation
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitOperationDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read split-detection progress and outcome
      tags:
        - filler
  /v1/filler/splits/{proposalId}:
    get:
      description: Admin only (§10, V34). The review surface's source of truth on SSE reconnect — the same pattern as /v1/proposals/{id}.
      operationId: get-filler-split
      parameters:
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitProposal"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read a split proposal
      tags:
        - filler
  /v1/filler/splits/{proposalId}/confirm:
    post:
      description: "Admin only (§10, V34). The body is the operator's confirmed cut list — the proposal as returned, possibly edited (cuts moved/merged/dropped; era suggestions accepted or rejected; dedup-flagged segments kept or skipped). Only now do segments become catalog clips: cut with ffmpeg stream copy, and the original compilation row removed — its identity is a path that now means twenty clips, not one."
      operationId: confirm-filler-split
      parameters:
        - in: path
          name: proposalId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmFillerSplitInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmFillerSplitOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Commit a reviewed split
      tags:
        - filler
  /v1/filler/sync:
    post:
      description: Admin only (§10).
      operationId: sync-filler
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sync the clip catalog from the media server
      tags:
        - filler
  /v1/filler/tag:
    post:
      description: Admin only. Text-signal classification (§10).
      operationId: tag-filler
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagFillerOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: AI-tag untagged clips
      tags:
        - filler
  /v1/filler/tags:
    patch:
      description: Admin only. Corrects kind, era, audience, brand, and directly asserted taxonomy tags. The clip is identified by content `hash` in the body (§10 V45a).
      operationId: tag-filler-clip
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchClipInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClipDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a clip's classification
      tags:
        - filler
  /v1/filler/watch:
    get:
      description: "The Filler page header's live status (§10 V38c): how many sources are on, how many clips the catalog holds, when anything last arrived, and a health verdict. ⚠ The verdict is computed on the SERVER — the rule ('every source dark', 'nothing has arrived in days') is domain logic, and deriving it in the client would also have left members with a permanently grey indicator, since the sources listing is admin-only. Read-only and member-visible: it names no paths, targets or ids — only counts and a verdict."
      operationId: filler-watch
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillerWatchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Is filler working right now
      tags:
        - filler
  /v1/guide:
    get:
      description: "Per-channel programme timelines across [from, to), for Loomarr's own time grid. Commercial pods, pending acquisitions and flex are all returned with a `kind` discriminator rather than being filtered or collapsed to a boolean, so the grid can draw them distinctly. Times are absolute epoch ms; a block already in progress reports its real start. NOT the XMLTV guide a media server reads — that is /playout/guide.xml. Read-only: any authenticated user (§8.1 viewer-facing)."
      operationId: channel-guide
      parameters:
        - description: Window start, epoch ms. Defaults to now.
          explode: false
          in: query
          name: from
          schema:
            description: Window start, epoch ms. Defaults to now.
            format: int64
            type: integer
        - description: Window end, epoch ms. Defaults to 4 hours after the window start.
          explode: false
          in: query
          name: to
          schema:
            description: Window end, epoch ms. Defaults to 4 hours after the window start.
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuideOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every channel's timeline over a window
      tags:
        - channels
  /v1/healthz:
    get:
      description: Public, no credential — the consumer is a container runtime, not a person. Answers 200 whenever the process is serving, regardless of whether its dependencies are healthy; that is what `readyz` is for. Also served at `/healthz`.
      operationId: healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Liveness probe
      tags:
        - ops
  /v1/images:
    post:
      description: Stores an image and returns its record. Raster only — SVG is refused.
      operationId: upload-image
      parameters:
        - description: poster | backdrop | icon | thumb
          explode: false
          in: query
          name: role
          schema:
            description: poster | backdrop | icon | thumb
            examples:
              - icon
            type: string
        - description: public | member
          explode: false
          in: query
          name: visibility
          schema:
            description: public | member
            examples:
              - member
            type: string
        - description: What this image decorates, e.g. channel
          explode: false
          in: query
          name: ownerKind
          schema:
            description: What this image decorates, e.g. channel
            type: string
        - description: The id of the thing it decorates
          explode: false
          in: query
          name: ownerId
          schema:
            description: The id of the thing it decorates
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: image/png,image/jpeg,image/webp,image/gif
            schema:
              properties:
                file:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  description: The image. Raster only — SVG is refused.
                  format: binary
                  type: string
              required:
                - file
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload an image
      tags:
        - Images
  /v1/images/{hash}:
    get:
      description: Dimensions, placeholder and per-format srcset strings for one image — everything an <img> needs to render without layout shift.
      operationId: get-image
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            examples:
              - 9f2b1c4e8a7d65039f2b1c4e8a7d65039f2b1c4e8a7d65039f2b1c4e8a7d6503
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read an image's record
      tags:
        - Images
  /v1/images/{hash}/{rendition}:
    get:
      description: Returns the bytes of one rendition (a width in a format) of a stored image. Content-addressed, so the response is immutable and cacheable forever.
      operationId: serve-image
      parameters:
        - description: The image's content hash
          in: path
          name: hash
          required: true
          schema:
            description: The image's content hash
            examples:
              - 9f2b1c4e8a7d65039f2b1c4e8a7d65039f2b1c4e8a7d65039f2b1c4e8a7d6503
            type: string
        - description: Width and format, as w<width>.<ext>
          in: path
          name: rendition
          required: true
          schema:
            description: Width and format, as w<width>.<ext>
            examples:
              - w342.webp
            type: string
      responses:
        "200":
          content:
            image/avif:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
            image/jpeg:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
            image/webp:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The image bytes
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Serve one image rendition
      tags:
        - Images
