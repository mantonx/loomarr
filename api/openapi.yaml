components:
  schemas:
    AcquisitionOutcomeDTO:
      additionalProperties: false
      properties:
        admitted:
          format: int64
          type: integer
        dismissed:
          format: int64
          type: integer
        enrolled:
          format: int64
          type: integer
        needsDecision:
          format: int64
          type: integer
        preparing:
          format: int64
          type: integer
        rejected:
          format: int64
          type: integer
      required:
        - enrolled
        - preparing
        - needsDecision
        - admitted
        - rejected
        - dismissed
      type: object
    ActiveRuleDTO:
      additionalProperties: false
      properties:
        id:
          description: Stable rule id ('' when no rule matched)
          type: string
        label:
          description: Human-readable rule name, or 'Base policy' when none matched
          type: string
        matched:
          description: Whether a curation rule matched (false = base whole-policy behavior)
          type: boolean
        priority:
          description: The rule's priority (higher wins overlaps); 0 for the base policy
          format: int64
          type: integer
      required:
        - id
        - label
        - priority
        - matched
      type: object
    Activity:
      additionalProperties: false
      properties:
        at:
          format: int64
          type: integer
        id:
          type: string
        kind:
          type: string
        level:
          type: string
        subjectId:
          type: string
        text:
          type: string
      required:
        - id
        - at
        - kind
        - level
        - text
      type: object
    ActivityEvent:
      additionalProperties: false
      type: object
    AddFillerSourceInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/AddFillerSourceInputBody.json
          format: uri
          readOnly: true
          type: string
        country:
          description: ISO 3166-1 alpha-2 source country
          maxLength: 2
          type: string
        kind:
          description: Which kind of source this is
          enum:
            - archive
            - youtube
            - folder
            - library
          type: string
        label:
          description: Operator-facing name; falls back to the identifier
          type: string
        market:
          description: Local source market; omit for country-wide
          maxLength: 120
          type: string
        uri:
          description: An archive.org collection identifier/URL, a YouTube playlist or channel URL, a folder path Loomarr can read, or a media-server library name
          minLength: 1
          type: string
      required:
        - kind
        - uri
      type: object
    AdjacentContext:
      additionalProperties: false
      properties:
        key:
          type: string
        name:
          type: string
        votes:
          format: int64
          type: integer
        year:
          format: int64
          type: integer
      required:
        - name
      type: object
    Aggregate:
      additionalProperties: false
      properties:
        candidateCount:
          format: int64
          type: integer
        costNanos:
          format: int64
          type: integer
        count:
          format: int64
          type: integer
        day:
          type: string
        durationMillis:
          format: int64
          type: integer
        outcome:
          type: string
        runSnapshotId:
          type: string
        stage:
          type: string
        toolCalls:
          format: int64
          type: integer
      required:
        - day
        - stage
        - outcome
        - count
        - durationMillis
        - toolCalls
        - candidateCount
        - costNanos
      type: object
    AppliedRelaxation:
      additionalProperties: false
      properties:
        from:
          type: string
        kind:
          type: string
        to:
          type: string
      required:
        - kind
        - from
        - to
      type: object
    ApprovalEditDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ApprovalEditDTO.json
          format: uri
          readOnly: true
          type: string
        add:
          description: Titles to add as acquisitions
          items:
            $ref: "#/components/schemas/ProposalItem"
          type: array
        drop:
          description: Provisioning keys to remove from the proposal before approving
          items:
            type: string
          type: array
        note:
          description: A message to the requester, stored with the approval
          type: string
      type: object
    ApproveFillerPullInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ApproveFillerPullInputBody.json
          format: uri
          readOnly: true
          type: string
        dropSourceIds:
          items:
            type: string
          type: array
        note:
          description: Narrowing instruction, e.g. 'no local dealers, no PSAs'
          type: string
      type: object
    ApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        channelId:
          description: The channel atomically created or patched by this approval (§7)
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        status:
          type: string
      required:
        - status
        - enqueued
        - channelId
      type: object
    AudiencePolicy:
      additionalProperties: false
      properties:
        ceiling:
          type: string
        unrated:
          type: string
      type: object
    AutoCurate:
      additionalProperties: false
      properties:
        maxTitles:
          format: int64
          type: integer
        minScorePct:
          format: int64
          type: integer
      type: object
    BackupEntry:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BackupEntry.json
          format: uri
          readOnly: true
          type: string
        bytes:
          description: Size on disk
          format: int64
          type: integer
        name:
          description: Filename, e.g. loomarr-2026-07-29-033000.db
          type: string
        writtenAt:
          description: Unix seconds
          format: int64
          type: integer
      required:
        - name
        - bytes
        - writtenAt
      type: object
    BackupList:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BackupList.json
          format: uri
          readOnly: true
          type: string
        backups:
          description: On disk, newest first
          items:
            $ref: "#/components/schemas/BackupEntry"
          type: array
        dir:
          description: Where backups are written (backup.dir)
          type: string
        retain:
          description: How many backups are kept; 0 keeps everything
          format: int64
          type: integer
        schedule:
          description: Cron for the scheduled backup (backup.schedule)
          type: string
        supported:
          description: Whether in-app backup is available on this backend
          type: boolean
      required:
        - supported
        - dir
        - schedule
        - retain
        - backups
      type: object
    BootstrapInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BootstrapInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          description: The owning admin's password (Argon2id-hashed at rest).
          type: string
        username:
          description: The owning admin's local username.
          type: string
      required:
        - username
        - password
      type: object
    BootstrapOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BootstrapOutputBody.json
          format: uri
          readOnly: true
          type: string
        id:
          type: string
        name:
          type: string
        role:
          type: string
      required:
        - id
        - name
        - role
      type: object
    BulkApproveInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BulkApproveInputBody.json
          format: uri
          readOnly: true
          type: string
        ids:
          description: Proposal ids to approve, each through the single approval gate
          items:
            type: string
          minItems: 1
          type: array
      required:
        - ids
      type: object
    BulkApproveOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BulkApproveOutputBody.json
          format: uri
          readOnly: true
          type: string
        approved:
          description: How many were approved
          format: int64
          type: integer
        results:
          items:
            $ref: "#/components/schemas/BulkApproveResult"
          type: array
      required:
        - results
        - approved
      type: object
    BulkApproveResult:
      additionalProperties: false
      properties:
        channelId:
          type: string
        enqueued:
          description: Acquisitions enqueued as wanted titles
          format: int64
          type: integer
        error:
          description: Why this one did not approve (already handled, not found, …)
          type: string
        id:
          type: string
        ok:
          type: boolean
      required:
        - id
        - ok
      type: object
    BulkRemoveFillerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BulkRemoveFillerInputBody.json
          format: uri
          readOnly: true
          type: string
        hashes:
          description: Clip identities (content hashes, §10 V45a)
          items:
            type: string
          minItems: 1
          type: array
        restore:
          description: Put the clips back in the catalog instead of removing them
          type: boolean
      required:
        - hashes
      type: object
    BulkResultOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BulkResultOutputBody.json
          format: uri
          readOnly: true
          type: string
        missing:
          format: int64
          type: integer
        updated:
          description: How many clips actually changed
          format: int64
          type: integer
      required:
        - updated
        - missing
      type: object
    BulkTagFillerInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BulkTagFillerInputBody.json
          format: uri
          readOnly: true
          type: string
        audience:
          description: Omit to leave it alone.
          enum:
            - kids
            - family
            - general
            - late_night
          type: string
        era:
          description: Set the era on every selected clip. Omit to leave it alone.
          format: int64
          type: integer
        hashes:
          description: Clip identities (content hashes, §10 V45a)
          items:
            type: string
          minItems: 1
          type: array
        tags:
          description: Taxonomy tags to set on every selected clip. Grounded on write; category derived. Omit to leave alone (§10 V45a).
          items:
            type: string
          type: array
      required:
        - hashes
      type: object
    BundleBuild:
      additionalProperties: false
      properties:
        builtAt:
          type: string
        commit:
          type: string
        dirty:
          type: boolean
        version:
          type: string
      required:
        - version
      type: object
    BundleCounts:
      additionalProperties: false
      properties:
        discardedProcessLines:
          format: int64
          type: integer
        eventRecorderDrops:
          format: int64
          minimum: 0
          type: integer
        events:
          format: int64
          type: integer
        eventsOmittedAtLeast:
          format: int64
          type: integer
        processOutputs:
          format: int64
          type: integer
        processOutputsOmitted:
          format: int64
          type: integer
        processes:
          format: int64
          type: integer
        processesOmittedAtLeast:
          format: int64
          type: integer
        redactions:
          format: int64
          type: integer
      required:
        - events
        - eventsOmittedAtLeast
        - processes
        - processesOmittedAtLeast
        - processOutputs
        - processOutputsOmitted
        - eventRecorderDrops
        - discardedProcessLines
        - redactions
      type: object
    BundleEntry:
      additionalProperties: false
      properties:
        name:
          type: string
        uncompressedBytes:
          format: int64
          type: integer
      required:
        - name
        - uncompressedBytes
      type: object
    BundleManifest:
      additionalProperties: false
      properties:
        clientVersions:
          items:
            type: string
          type: array
        counts:
          $ref: "#/components/schemas/BundleCounts"
        effectiveFrom:
          format: int64
          type: integer
        effectiveTo:
          format: int64
          type: integer
        entries:
          items:
            $ref: "#/components/schemas/BundleEntry"
          type: array
        finalArchiveBytes:
          format: int64
          type: integer
        formatVersion:
          type: string
        generatedAt:
          format: int64
          type: integer
        loomarr:
          $ref: "#/components/schemas/BundleBuild"
        selection:
          $ref: "#/components/schemas/BundleSelection"
        truncationReasons:
          items:
            type: string
          type: array
        uncompressedBytes:
          format: int64
          type: integer
      required:
        - formatVersion
        - generatedAt
        - selection
        - effectiveFrom
        - effectiveTo
        - loomarr
        - clientVersions
        - entries
        - counts
        - truncationReasons
        - uncompressedBytes
        - finalArchiveBytes
      type: object
    BundlePreview:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BundlePreview.json
          format: uri
          readOnly: true
          type: string
        estimatedBytes:
          format: int64
          type: integer
        manifest:
          $ref: "#/components/schemas/BundleManifest"
      required:
        - manifest
        - estimatedBytes
      type: object
    BundleSelection:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/BundleSelection.json
          format: uri
          readOnly: true
          type: string
        channelId:
          maxLength: 128
          type: string
        events:
          type: boolean
        from:
          format: int64
          minimum: 0
          type: integer
        jobId:
          maxLength: 128
          type: string
        playbackSessionId:
          maxLength: 128
          type: string
        processOutput:
          type: boolean
        processRunId:
          maxLength: 128
          type: string
        processes:
          type: boolean
        requestId:
          maxLength: 128
          type: string
        scheduleBlockId:
          maxLength: 128
          type: string
        to:
          format: int64
          minimum: 0
          type: integer
      required:
        - from
        - to
        - events
        - processes
        - processOutput
      type: object
    ChangePasswordInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ChangePasswordInputBody.json
          format: uri
          readOnly: true
          type: string
        current:
          description: Your current password.
          format: password
          type: string
        next:
          description: The new password (min 8 characters).
          format: password
          minLength: 8
          type: string
      required:
        - current
        - next
      type: object
    ChannelDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ChannelDTO.json
          format: uri
          readOnly: true
          type: string
        breakCount:
          description: Commercial-break gaps (§10) — NOT titles; a healthy break-heavy channel has a large breakCount and zero pendingCount
          format: int64
          type: integer
        group:
          examples:
            - Kids
          type: string
        id:
          examples:
            - ch_abc123
          type: string
        inAppPlayable:
          description: True when this channel can be tuned by Loomarr's in-app player
          type: boolean
        intentRef:
          type: string
        lineup:
          description: The channel's titles, in order (the intent-level lineup, not the expanded slots)
          items:
            $ref: "#/components/schemas/LineupEntryDTO"
          type: array
        logo:
          description: Channel icon URL — pushed to Tunarr's channel icon (from TMDB, an upload, or set directly)
          type: string
        logoImage:
          $ref: "#/components/schemas/ImageDTO"
          description: The image record when the logo is served by this instance's image service; absent for an external URL
        name:
          examples:
            - Saturday Morning Cartoons
          type: string
        number:
          description: Guide channel number
          examples:
            - 42
          format: int64
          type: integer
        pendingCount:
          description: "Lineup titles not yet available — awaiting acquisition (coming-soon gaps + pod-fill placeholders). Health keys on this: pendingCount==0 means every title is ready, even on a channel full of commercial breaks."
          format: int64
          type: integer
        policy:
          $ref: "#/components/schemas/ChannelPolicy"
          description: Programming policy (scope/audience/separation/ordering/seasonal) + applied relaxations
        programCount:
          description: Real playable programs (available titles) in the desired lineup
          format: int64
          type: integer
        revision:
          description: Optimistic-concurrency revision. Send this value with PATCH; a stale edit is rejected instead of overwriting a newer channel definition.
          format: int64
          minimum: 1
          type: integer
        slotCount:
          description: Total desired slots incl. breaks + placeholders. NOT a readiness signal — use programCount/pendingCount (a break gap inflates this without any title pending). Kept for diagnostics.
          format: int64
          type: integer
        status:
          description: Loomarr-side channel status (§9)
          enum:
            - building
            - live
            - empty
            - drifted
            - detached
            - paused
          type: string
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
        tunarrId:
          description: Server-assigned id of the retained managed Tunarr projection; empty until the first-ever successful Tunarr projection and retained after a later switch to internal playout
          type: string
      required:
        - id
        - revision
        - name
        - number
        - strategy
        - status
        - inAppPlayable
        - programCount
        - pendingCount
        - breakCount
        - slotCount
        - policy
        - lineup
      type: object
    ChannelEvent:
      additionalProperties: false
      properties:
        channelId:
          examples:
            - ch_abc123
          type: string
        status:
          type: string
      required:
        - channelId
        - status
      type: object
    ChannelFitDTO:
      additionalProperties: false
      properties:
        channelId:
          type: string
        excluded:
          type: boolean
        level:
          description: The rung this clip would be drawn from; bumper_card means it is not a candidate (see reason)
          enum:
            - exact
            - widened
            - audience
            - bumper_card
          type: string
        name:
          type: string
        number:
          format: int64
          type: integer
        pinned:
          type: boolean
        reason:
          description: Why the clip is not a candidate; absent when it is one
          enum:
            - kind
            - duration
            - quality
            - category
            - audience
            - excluded
          type: string
      required:
        - channelId
        - name
        - number
        - level
        - pinned
        - excluded
      type: object
    ChannelHealth:
      additionalProperties: false
      properties:
        bufferedMs:
          description: Encoded lead over realtime in ms; negative = falling behind
          format: int64
          type: integer
        channelId:
          type: string
        coldStartMs:
          description: Time to first frame in ms — the black-screen window; 0 if unmeasured
          format: int64
          type: integer
        encoder:
          description: Resolved encoder, or 'copy' when direct-playing
          type: string
        hardware:
          description: Whether the encoder is hardware-accelerated
          type: boolean
        health:
          description: ok | degraded | stalled
          type: string
        mode:
          description: direct-play (copy) | transcode
          type: string
        name:
          description: Channel name for display (empty = unknown)
          type: string
        number:
          description: Channel number for display (0 = unknown)
          format: int64
          type: integer
        reason:
          description: One line an operator can act on
          type: string
        speed:
          description: Realtime multiple; <1.0 means the channel will stutter
          format: double
          type: number
        target:
          description: "Codec audience: browser|mediaserver (§9.1 V47)"
          type: string
        viewers:
          description: How many clients are attached
          format: int64
          type: integer
      required:
        - channelId
        - number
        - name
        - target
        - viewers
        - bufferedMs
        - encoder
        - hardware
        - mode
        - speed
        - health
        - reason
        - coldStartMs
      type: object
    ChannelNowNext:
      additionalProperties: false
      properties:
        channelId:
          description: Loomarr channel id
          type: string
        next:
          $ref: "#/components/schemas/NowNextEntry"
        now:
          $ref: "#/components/schemas/NowNextEntry"
      required:
        - channelId
      type: object
    ChannelPolicy:
      additionalProperties: false
      properties:
        applied:
          items:
            $ref: "#/components/schemas/AppliedRelaxation"
          type: array
        audience:
          $ref: "#/components/schemas/AudiencePolicy"
        autoCurate:
          $ref: "#/components/schemas/AutoCurate"
        breakDuration:
          description: A Go-duration string, e.g. "168h" (7 days) or "24h". Empty/omitted means no limit.
          examples:
            - 168h
            - 24h
          type: string
        breaksPerHour:
          format: int64
          type: integer
        filler:
          $ref: "#/components/schemas/FillerSelection"
        operatorSet:
          items:
            type: string
          type: array
        ordering:
          type: string
        playout:
          $ref: "#/components/schemas/PlayoutPolicy"
        rules:
          items:
            $ref: "#/components/schemas/SchedulingRule"
          type: array
        scope:
          $ref: "#/components/schemas/ScopePolicy"
        seasonal:
          $ref: "#/components/schemas/SeasonalPolicy"
        separation:
          $ref: "#/components/schemas/SeparationPolicy"
        window:
          description: A Go-duration string, e.g. "168h" (7 days) or "24h". Empty/omitted means no limit.
          examples:
            - 168h
            - 24h
          type: string
      type: object
    ChannelTracksOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ChannelTracksOutputBody.json
          format: uri
          readOnly: true
          type: string
        audio:
          items:
            $ref: "#/components/schemas/TrackDTO"
          type: array
        subtitles:
          items:
            $ref: "#/components/schemas/TrackDTO"
          type: array
      required:
        - audio
        - subtitles
      type: object
    ClearDiscoveryFeedbackInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ClearDiscoveryFeedbackInputBody.json
          format: uri
          readOnly: true
          type: string
        scope:
          enum:
            - household
            - channel
          type: string
        scopeId:
          type: string
        targetKey:
          type: string
      required:
        - scope
        - targetKey
      type: object
    ClientBatch:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ClientBatch.json
          format: uri
          readOnly: true
          type: string
        clientVersion:
          maxLength: 64
          type: string
        events:
          items:
            $ref: "#/components/schemas/ClientObservation"
          maxItems: 20
          minItems: 1
          type: array
        platform:
          enum:
            - chromium
            - firefox
            - webkit
            - unknown_web
            - android_tv
            - shield_tv
            - unknown_android_tv
          type: string
        source:
          enum:
            - web
            - android_tv
          type: string
      required:
        - source
        - clientVersion
        - platform
        - events
      type: object
    ClientDiagnosticsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/ClientDiagnosticsOutputBody.json
          format: uri
          readOnly: true
          type: string
        accepted:
          format: int64
          type: integer
