              - submitted
              - approved
              - denied
            type: string
        - description: Scope to the caller's own proposals (the My requests surface). Resolved from the session, not from a user id.
          explode: false
          in: query
          name: mine
          schema:
            description: Scope to the caller's own proposals (the My requests surface). Resolved from the session, not from a user id.
            type: boolean
      responses:
        "200":
          content:
            application/json:
