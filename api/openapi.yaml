                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Readiness probe
      tags:
        - ops
  /v1/reference:
    get:
      description: Public. A self-contained page linking to the machine-readable spec; no CDN assets.
      operationId: api-reference
      responses:
        "200":
          content:
            text/html:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: An HTML page.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Interactive API reference
      tags:
        - ops
  /v1/search:
    get:
      operationId: search
      parameters:
        - description: Title search terms. Omit when using structured discovery qualifiers.
          explode: false
          in: query
          name: q
          schema:
            description: Title search terms. Omit when using structured discovery qualifiers.
            type: string
        - description: Corpus to search (default all). Clips are not searchable here — use /v1/filler?q=
          explode: false
          in: query
          name: scope
          schema:
            description: Corpus to search (default all). Clips are not searchable here — use /v1/filler?q=
            enum:
              - library
              - tmdb
              - all
            type: string
        - description: Max results (default 20)
          explode: false
          in: query
          name: limit
          schema:
            description: Max results (default 20)
            format: int64
            minimum: 1
            type: integer
        - description: Optional title-result narrowing, or the media type for structured discovery
          explode: false
          in: query
          name: media_type
          schema:
            description: Optional title-result narrowing, or the media type for structured discovery
            enum:
              - movie
              - series
            type: string
        - description: Structured genre terms; repeat the parameter for multiple values
          explode: true
          in: query
          name: genres
          schema:
            description: Structured genre terms; repeat the parameter for multiple values
            items:
              type: string
            type: array
        - description: Structured thematic keyword terms; repeat the parameter for multiple values
          explode: true
          in: query
          name: keywords
          schema:
            description: Structured thematic keyword terms; repeat the parameter for multiple values
            items:
              type: string
            type: array
        - description: Earliest release or first-air year
          explode: false
          in: query
          name: year_from
          schema:
            description: Earliest release or first-air year
            format: int64
            maximum: 9999
            minimum: 1000
            type: integer
        - description: Latest release or first-air year
          explode: false
          in: query
          name: year_to
          schema:
            description: Latest release or first-air year
            format: int64
            maximum: 9999
            minimum: 1000
            type: integer
        - description: Two-letter original-language code
          explode: false
          in: query
          name: original_language
          schema:
            description: Two-letter original-language code
            maxLength: 2
            type: string
        - description: Two-letter origin-country code
          explode: false
          in: query
          name: origin_country
          schema:
            description: Two-letter origin-country code
            maxLength: 2
            type: string
        - description: Minimum runtime in minutes
          explode: false
          in: query
          name: runtime_min
          schema:
            description: Minimum runtime in minutes
            format: int64
            maximum: 1440
            minimum: 1
            type: integer
        - description: Maximum runtime in minutes
          explode: false
          in: query
          name: runtime_max
          schema:
            description: Maximum runtime in minutes
            format: int64
            maximum: 1440
            minimum: 1
            type: integer
        - description: Minimum TMDB vote average
          explode: false
          in: query
          name: vote_average_min
          schema:
            description: Minimum TMDB vote average
            exclusiveMinimum: 0
            format: double
            maximum: 10
            type: number
        - description: Minimum TMDB vote count
          explode: false
          in: query
          name: vote_count_min
          schema:
            description: Minimum TMDB vote count
            format: int64
            maximum: 100000000
            minimum: 1
            type: integer
        - description: Exact TV network name; requires media_type=series
          explode: false
          in: query
          name: network
          schema:
            description: Exact TV network name; requires media_type=series
            maxLength: 100
            type: string
        - description: Exact movie cast names; repeat the parameter for multiple values
          explode: true
          in: query
          name: cast
          schema:
            description: Exact movie cast names; repeat the parameter for multiple values
            items:
              type: string
            maxItems: 4
            type: array
        - description: Exact movie director, writer, or crew names; repeat the parameter for multiple values
          explode: true
          in: query
          name: creators
          schema:
            description: Exact movie director, writer, or crew names; repeat the parameter for multiple values
            items:
              type: string
            maxItems: 4
            type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Federated search (library + TMDB)
      tags:
        - search
  /v1/sessions/{hash}:
    delete:
      operationId: revoke-session
      parameters:
        - in: path
          name: hash
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke one session (admin)
      tags:
        - users
  /v1/settings:
    get:
      description: Admin only. Every operator-managed setting with resolved value (secrets masked), provenance, and audit (config-design §8).
      operationId: settings-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List settings
      tags:
        - settings
    patch:
      description: "Admin only. Per-key results (saved | invalid | pinned). A saved value follows that setting's apply contract: live on the next owning operation, or restart in the next app generation (config-design §3/§8)."
      operationId: settings-patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatchInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPatchOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update settings
      tags:
        - settings
  /v1/settings/secrets/{name}:
    get:
      description: Admin only. Returns API_TOKEN or PLAYOUT_TOKEN for config-design §4's eye toggle. Reading never rotates.
      operationId: secret-reveal
      parameters:
        - description: Which generated token to reveal.
          in: path
          name: name
          required: true
          schema:
            description: Which generated token to reveal.
            enum:
              - api_token
              - playout_token
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRevealOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Reveal a generated token
      tags:
        - settings
  /v1/settings/secrets/{name}/regenerate:
    post:
      description: Admin only. Rotates API_TOKEN or PLAYOUT_TOKEN with the §4 side-effects and returns the new value.
      operationId: secret-regenerate
      parameters:
        - description: Which generated token to rotate.
          in: path
          name: name
          required: true
          schema:
            description: Which generated token to rotate.
            enum:
              - api_token
              - playout_token
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretRegenerateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Regenerate a generated token
      tags:
        - settings
  /v1/settings/{key}:
    delete:
      description: Admin only. Drops the stored override so the key reverts to env/default — the explicit clear, and the only way to unset a secret (config-design §8/§9).
      operationId: settings-clear
      parameters:
        - description: Registry key to clear, e.g. seerr.api_key.
          in: path
          name: key
          required: true
          schema:
            description: Registry key to clear, e.g. seerr.api_key.
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Clear a setting
      tags:
        - settings
  /v1/settings/{key}/env-override:
    put:
      description: Admin only. Sets or clears the durable claim that this key is app-managed even though its environment variable is set (config-design §3.1). Unlocking seeds the stored value from the env value it takes over, so nothing changes until the operator saves; a secret never seeds. 404 unknown key (bootstrap keys are not in the registry), 409 when the environment does not pin the key.
      operationId: settings-env-override
      parameters:
        - description: Registry key, e.g. seerr.url.
          in: path
          name: key
          required: true
          schema:
            description: Registry key, e.g. seerr.url.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsEnvOverrideInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Take a setting back from the environment
      tags:
        - settings
  /v1/setup/bootstrap:
    post:
      description: "First-run only: creates the owning local admin. Succeeds exactly once (409 once an admin exists). Unauthenticated by design — it is functional only while no admin exists (§11)."
      operationId: bootstrap
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create the first admin
      tags:
        - setup
  /v1/setup/livetv-reconnect:
    post:
      description: Admin only. Removes + re-adds Loomarr's currently applied tuner in the media server and re-scans it, clearing a stale channel→stream binding ('guide right, plays wrong'). Works for internal or Tunarr playout and is serialized with backend transitions (§6/§9).
      operationId: livetv-reconnect
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivetvReconnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Force-re-wire the Live TV tuner
      tags:
        - setup
  /v1/setup/state:
    get:
      description: Unauthenticated. Reports only whether bootstrap has happened, so the frontend can route a first-run visitor to the wizard instead of a login they cannot pass (§7/§13). Exposes nothing that POST /v1/setup/bootstrap doesn't already reveal by answering 409-vs-created.
      operationId: setup-state
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStateOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Whether the install has an owning admin
      tags:
        - setup
  /v1/setup/status:
    get:
      description: Admin only. Per-integration pass/fail (§13).
      operationId: setup-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatusOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Connection checklist
      tags:
        - setup
  /v1/setup/test:
    post:
      description: Admin only. Powers the per-block Test buttons (config-design §8).
      operationId: setup-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsTestInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsTestOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Run one connection check
      tags:
        - settings
  /v1/setup/tunarr-connect:
    post:
      description: Admin only. Ensures Tunarr's Emby/Jellyfin source (Loomarr's admin token) + enables/scans the movie/show libraries. One-time, idempotent (§6).
      operationId: tunarr-connect
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunarrConnectOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Wire the library as Tunarr's media source
      tags:
        - setup
  /v1/system/backups:
    get:
      description: Admin only. What the scheduled backup job has written into the configured directory, plus the schedule and retention in force. A directory that does not exist yet is an empty list, not an error — nothing written yet is the normal state of a fresh install.
      operationId: system-backups-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Backups on disk, newest first
      tags:
        - system
    post:
      description: Admin only. Writes one snapshot into the configured directory and prunes to the retention policy — the same work the scheduled job does, without waiting for it.
      operationId: system-backups-run
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupEntry"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Write a backup now
      tags:
        - system
  /v1/system/backups/{name}:
    get:
      description: Admin only. Streams one file from the backup directory, honouring Range so a large download can resume. See `system-database-backup` to write a new one.
      operationId: system-backups-download
      parameters:
        - description: Backup filename, as listed by system-backups-list
          in: path
          name: name
          required: true
          schema:
            description: Backup filename, as listed by system-backups-list
            examples:
              - loomarr-2026-08-08T02-00-00Z.db
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The backup file.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download an already-written backup
      tags:
        - system
  /v1/system/database:
    get:
      description: Admin only. Which backend is live, whether a migration is offered, and how far one has got — including per-table row counts and the parity verdict.
      operationId: system-database-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Active backend + migration progress
      tags:
        - system
  /v1/system/database/backup:
    post:
      description: Admin only. Writes a server-side snapshot into the configured backup directory. This is the gate the migrate call enforces — a backup is required, not suggested, because it is the only thing that makes the move reversible.
      operationId: system-database-backup
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseBackup"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Write the pre-migration backup
      tags:
        - system
  /v1/system/database/migrate:
    post:
      description: "Admin only. Refuses without a passing preflight and a backup. The source is only ever read: on any failure the install is still running on SQLite and nothing was lost. Progress streams over /v1/events as `database` frames."
      operationId: system-database-migrate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTargetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Copy every table into the target and verify parity
      tags:
        - system
  /v1/system/database/preflight:
    post:
      description: Admin only. Runs every check against the target and returns them all — a check that ran and failed comes back with ok:false rather than as an error, so the operator sees which one. Nothing is written to either database.
      operationId: system-database-preflight
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTargetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabasePreflightOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Probe a candidate PostgreSQL target
      tags:
        - system
  /v1/system/database/switchover:
    post:
      description: Admin only. Persists the new DATABASE_URL to the bootstrap file. Takes effect on restart; the SQLite file is left in place untouched, so reverting is a one-line change.
      operationId: system-database-switchover
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseTargetInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseSwitchoverOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Point the next boot at the migrated database
      tags:
        - system
  /v1/system/discovery-quality/export:
    get:
      description: Admin only. Downloads privacy-safe daily aggregates and their referenced run snapshots; no raw observations or receipt keys are included.
      operationId: export-discovery-quality
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
          description: OK
          headers:
            Content-Disposition:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Export local discovery-quality measurements
      tags:
        - system
  /v1/system/llm:
    get:
      description: "Admin only. Active provider + model; the local-model catalog (for Ollama: detected VRAM/version, fit verdicts, recommended default, pulled flags); and the hosted-provider catalog (base URLs, live model lists, keyConfigured). API keys are never returned (§8.1)."
      operationId: system-llm-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLLMStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: LLM host probe + model catalog
      tags:
        - system
  /v1/system/llm/discover:
    get:
      description: "Admin only. Returns the most-popular downloadable GGUF models (Hugging Face) that are COMPATIBLE with this machine, ranked best-first (§8.1): each repo's best-fitting quant is chosen against detected VRAM and repos where nothing fits are dropped. Each result carries a pullRef to hand to POST /pull. Tool-capability is confirmed only AFTER the model is pulled and probed. Best-effort: if the source is unreachable the list is empty (browse on huggingface.co)."
      operationId: system-llm-discover
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-discoverResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Compatible downloadable local models
      tags:
        - system
  /v1/system/llm/pull:
    post:
      description: Admin only. Local Ollama only (409 on a hosted provider). Starts a pull as a background job; percent-complete streams over /v1/events (§8.1). Idempotent.
      operationId: system-llm-pull
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMPullInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-pullResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Download a local model
      tags:
        - system
  /v1/system/llm/pull-operations/{jobId}:
    get:
      description: Admin only. Authoritative reconnect state for the jobId returned by POST /v1/system/llm/pull. SSE llm_pull frames only accelerate progress display.
      operationId: system-llm-pull-operation
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLLMPullOperationDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Read local-model download progress and outcome
      tags:
        - system
  /v1/system/llm/select:
    post:
      description: "Admin only. Persists the choice and hot-swaps the running suggester with no restart (§8.1). Local model must be pulled (409 else). Hosted: an optional apiKey is validated live before committing (401 on a bad key) and stored as a secret, never echoed."
      operationId: system-llm-select
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMSelectInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemLLMStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Select the active provider + model
      tags:
        - system
  /v1/system/llm/test:
    post:
      description: Admin only. Validates a hosted provider + API key WITHOUT swapping (§8.1). Returns ok + an error hint; a bad key is ok=false (not a 5xx).
      operationId: system-llm-test
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemLLMTestInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System-llm-testResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Test a hosted provider + key
      tags:
        - system
  /v1/system/reload:
    post:
      description: Admin only. Re-runs the connection checks without restarting or tearing anything down — no downtime. Uses the same probe implementation as the wizard's checklist, so the two can never disagree.
      operationId: system-reload
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemReloadOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Re-probe every configured service
      tags:
        - system
  /v1/system/restart:
    get:
      description: Admin only. The live count of channels Loomarr is streaming (which drop for a few seconds; Tunarr-backed channels keep playing), plus any restart-scoped setting waiting on a restart. Read-only — this does not restart anything.
      operationId: system-restart-cost
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartCost"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What a restart would cost right now
      tags:
        - system
    post:
      description: Admin only. Drains connections, tears down playout, and rebuilds every subsystem in the same process (§9.2) — no supervisor required. Responds before the drain begins, because a client that never gets a reply cannot tell 'restarting' from 'crashed'.
      operationId: system-restart
      responses:
        "202":
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Restart Loomarr in place
      tags:
        - system
  /v1/system/security/encryption:
    get:
      description: Admin only. Reports the non-secret installation-key fingerprint and retained data-key count.
      operationId: system-encryption-status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptionStatus"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Database secret-encryption status
      tags:
        - system
  /v1/system/security/encryption/rotate:
    post:
      description: Admin only. New secret writes immediately use a fresh data key; prior keys remain readable.
      operationId: system-encryption-rotate-data-key
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Rotate the active data-encryption key
      tags:
        - system
  /v1/system/services:
    get:
      description: Admin only. Runs the SAME connection checks as the wizard checklist and /v1/system/reload — one probe implementation, so the three surfaces cannot disagree about whether the media server is reachable. Polled by the Dashboard every 30s.
      operationId: system-services
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicesView"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Every configured integration and whether it answers
      tags:
        - system
  /v1/system/version:
    get:
      description: What the operator quotes in a bug report, plus the readiness /v1/readyz reports. The probes stay unauthenticated for orchestrators (RolePublic); this is their authenticated twin, carrying the build and schema detail a probe has no business returning.
      operationId: system-version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemVersionOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Version and readiness of this instance
      tags:
        - system
  /v1/taxonomy:
    get:
      description: The operator-editable tag graph the filler tagger grounds against and curation matches over (§10 V45a). Ordered by axis then slug. Read-only, so any authenticated user may call it.
