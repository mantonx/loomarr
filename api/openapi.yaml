          type: integer
        deleteBlocked:
          description: True when direct stored assertions must be retagged before deletion
          type: boolean
        descendantStoredClips:
          description: Distinct stored clips asserting a descendant
          format: int64
          type: integer
        descendants:
          items:
            $ref: "#/components/schemas/TaxonomyImpactNodeDTO"
          type: array
        directStoredClips:
          description: Stored clips directly asserting the selected taxon
          format: int64
          type: integer
        resolverTermsAdded:
          description: New classifier spellings that will resolve after the edit
          items:
            type: string
          type: array
        resolverTermsRemoved:
          description: Classifier spellings that will stop resolving after the edit
          items:
            type: string
          type: array
        savedChannelSelections:
          description: Saved channel selections referencing the selected taxon or descendants
          items:
            $ref: "#/components/schemas/TaxonomyImpactChannelDTO"
          type: array
      required:
        - directStoredClips
        - descendantStoredClips
        - affectedStoredClips
        - affectedPlayableClips
        - descendants
        - savedChannelSelections
        - resolverTermsAdded
        - resolverTermsRemoved
        - deleteBlocked
      type: object
    TaxonomyImpactNodeDTO:
      additionalProperties: false
      properties:
        label:
          type: string
        slug:
          type: string
      required:
        - slug
        - label
      type: object
    TimelineOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/TimelineOutputBody.json
          format: uri
          readOnly: true
          type: string
        airings:
          description: The current programme (first) then the next few and the breaks between them, in airtime order, with a preview image per programme block
          items:
            $ref: "#/components/schemas/GuideAiring"
          type: array
        serverNowMs:
          description: Server wall-clock at projection time, used to compare the displayed frame with schedule truth without trusting device clock
          format: int64
          type: integer
      required:
        - serverNowMs
        - airings
      type: object
    TitleDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/TitleDTO.json
          format: uri
          readOnly: true
          type: string
        downloadStatus:
          description: Download-client status (downloading/warning/stalled/…)
          type: string
        etaText:
          description: Human time-left from the download client
          type: string
        key:
          description: Stable identity key
          examples:
            - movie:tmdb:1111867
          type: string
        libraryId:
          type: string
        mediaType:
          enum:
            - movie
            - series
          examples:
            - movie
          type: string
        name:
          examples:
            - In Flames
          type: string
        progress:
          description: Download completion 0..1 (arr queue poll)
          format: double
          type: number
        state:
          description: Provisioning state (§4)
          enum:
            - wanted
            - requested
            - downloading
            - available
            - unavailable
          type: string
        tmdbId:
          examples:
            - 1111867
          format: int64
          type: integer
        tvdbId:
          format: int64
          type: integer
        year:
          examples:
            - 2023
          format: int64
          type: integer
      required:
        - key
        - mediaType
        - state
      type: object
    TitleEvent:
      additionalProperties: false
      properties:
        key:
          examples:
            - movie:tmdb:1111867
          type: string
        name:
          examples:
            - In Flames
          type: string
        state:
          enum:
            - wanted
            - requested
            - downloading
            - available
            - unavailable
          type: string
      required:
        - key
        - state
      type: object
    TrackDTO:
      additionalProperties: false
      properties:
        index:
          description: Position among tracks of its own type — the N in -map 0:a:N / 0:s:N.
          format: int64
          type: integer
        language:
          description: ISO 639-2 code, lowercased; empty when the media left it untagged.
          type: string
        title:
          description: Free-text stream title when the media carries one (e.g. 'Commentary').
          type: string
      required:
        - index
      type: object
    TunarrConnectOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/TunarrConnectOutputBody.json
          format: uri
          readOnly: true
          type: string
        librariesEnabled:
          description: Movie/show libraries now enabled + scanning
          format: int64
          type: integer
        sourceId:
          description: Tunarr media-source id (existing or newly created)
          type: string
      required:
        - sourceId
        - librariesEnabled
      type: object
    UpcomingOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/UpcomingOutputBody.json
          format: uri
          readOnly: true
          type: string
        upcoming:
          description: The program airing now (first, if any) then the next ones in airtime order; gaps skipped
          items:
            $ref: "#/components/schemas/NowNextEntry"
          type: array
      required:
        - upcoming
      type: object
    UpdateChannelInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/UpdateChannelInputBody.json
          format: uri
          readOnly: true
          type: string
        group:
          type: string
        lineup:
          description: Whole-list replace of the channel's lineup (ordered). Omit to leave unchanged. Each entry's key is validated; a not-yet-available key renders as a pending slot until the title lands.
          items:
            $ref: "#/components/schemas/LineupEntryDTO"
          type: array
        logo:
          description: Channel icon URL (from TMDB, an upload path, or set directly). Empty string clears it.
          type: string
        name:
          type: string
        number:
          format: int64
          minimum: 1
          type: integer
        policy:
          $ref: "#/components/schemas/ChannelPolicy"
          description: Per-channel programming policy; merged onto the channel. policy.applied is reconcile-owned and ignored on write.
        revision:
          description: Revision returned by the channel read this edit was based on. A stale revision is rejected with 409.
          format: int64
          minimum: 1
          type: integer
        status:
          description: Pause Loomarr-managed playout and guide surfaces, or resume. In v1, a retained Tunarr projection keeps its last lineup.
          enum:
            - paused
            - building
          type: string
        strategy:
          enum:
            - sequential
            - shuffle
            - time_slot
          type: string
      required:
        - revision
      type: object
    UpdateTaxonDTO:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/UpdateTaxonDTO.json
          format: uri
          readOnly: true
          type: string
        axis:
          enum:
            - product
            - format
            - seasonal
            - audience-cue
          type: string
        label:
          type: string
        parent:
          type: string
        retiredAliases:
          items:
            type: string
          type: array
        synonyms:
          items:
            type: string
          type: array
      required:
        - label
        - axis
      type: object
    UploadIconOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/UploadIconOutputBody.json
          format: uri
          readOnly: true
          type: string
        logo:
          description: The absolute serve URL now stored on the channel
          type: string
      required:
        - logo
      type: object
    UserBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/UserBody.json
          format: uri
          readOnly: true
          type: string
        autoApprove:
          type: boolean
        contactAddress:
          $ref: "#/components/schemas/ContactAddressBody"
        contactReplacement:
          $ref: "#/components/schemas/ContactAddressBody"
        disabled:
          type: boolean
        effectiveQuota:
          format: int64
          type: integer
        id:
          type: string
        local:
          type: boolean
        name:
          type: string
        offlineLogin:
          type: boolean
        pendingAcquisitions:
          format: int64
          type: integer
        quota:
          description: Pending-acquisition cap; 0 ⇒ the suggest.max_acquisitions default (§11)
          format: int64
          type: integer
        role:
          enum:
            - admin
            - member
          type: string
      required:
        - id
        - name
        - role
        - disabled
        - quota
        - pendingAcquisitions
        - effectiveQuota
        - autoApprove
        - local
        - offlineLogin
      type: object
    VerboseCapture:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/VerboseCapture.json
          format: uri
          readOnly: true
          type: string
        active:
          type: boolean
        channelId:
          type: string
        endsAt:
          format: int64
          type: integer
        startedAt:
          format: int64
          type: integer
        subsystem:
          type: string
      required:
        - active
      type: object
    VerboseCaptureInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/VerboseCaptureInputBody.json
          format: uri
          readOnly: true
          type: string
        channelId:
          maxLength: 128
          type: string
        durationMinutes:
          format: int64
          maximum: 15
          minimum: 1
          type: integer
        subsystem:
          maxLength: 128
          type: string
      required:
        - durationMinutes
      type: object
    Vocabulary:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/v1/schemas/Vocabulary.json
          format: uri
          readOnly: true
          type: string
        how:
          items:
            $ref: "#/components/schemas/HowVocab"
          type: array
        what:
          items:
            $ref: "#/components/schemas/WhatVocab"
          type: array
        when:
          items:
            $ref: "#/components/schemas/WhenVocab"
          type: array
      required:
        - when
        - what
        - how
      type: object
    WhatVocab:
      additionalProperties: false
      properties:
        label:
          type: string
        scope:
          $ref: "#/components/schemas/ScopePolicy"
        token:
          type: string
      required:
        - token
        - label
      type: object
    WhenPredicate:
      additionalProperties: false
      properties:
        dateFrom:
          format: date-time
          type: string
        dateTo:
          format: date-time
          type: string
        days:
          items:
            format: int64
            type: integer
          type: array
        holiday:
          type: string
        hourFrom:
          format: int64
          type: integer
        hourTo:
          format: int64
          type: integer
        weekday:
          type: boolean
        weekend:
          type: boolean
      type: object
    WhenVocab:
      additionalProperties: false
      properties:
        label:
          type: string
        predicate:
          $ref: "#/components/schemas/WhenPredicate"
        priority:
          format: int64
          type: integer
        shortLabel:
          type: string
        token:
          type: string
      required:
        - token
        - label
        - shortLabel
        - predicate
        - priority
      type: object
info:
  description: "Turn a sentence into a self-maintaining virtual TV channel. Every /v1 route requires a session cookie or Authorization: Bearer API_TOKEN (§7)."
  title: Loomarr API
  version: 0.1.0
openapi: 3.1.0
paths:
  /v1/activity:
    get:
      description: Admin only. Reads the persisted activity table (§5), NOT the SSE bus — the bus is deliberately lossy, so a feed built on it would drop entries exactly when the install is busiest. Survives a restart.
      operationId: list-activity
      parameters:
        - description: How many entries to return (default 20, max 200)
          explode: false
          in: query
          name: limit
          schema:
            description: How many entries to return (default 20, max 200)
            format: int64
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListActivityOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What Loomarr has been doing, newest first
      tags:
        - system
  /v1/auth/device:
    delete:
      operationId: device-revoke-current
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke the paired device making this request
      tags:
        - auth
  /v1/auth/device/approve:
    post:
      operationId: device-pair-approve
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceApproveInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceApproveOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Approve a device's pairing code
      tags:
        - auth
  /v1/auth/device/poll:
    post:
      operationId: device-pair-poll
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePollInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePollOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Exchange an approved pairing for a device token
      tags:
        - auth
  /v1/auth/device/start:
    post:
      operationId: device-pair-start
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceStartInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStartOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Begin pairing a device
      tags:
        - auth
  /v1/auth/devices:
    get:
      operationId: device-list
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List this user's paired devices
      tags:
        - auth
  /v1/auth/devices/{id}:
    delete:
      operationId: device-revoke
      parameters:
        - description: Device id from the device list
          in: path
          name: id
          required: true
          schema:
            description: Device id from the device list
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Revoke one paired device
      tags:
        - auth
  /v1/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Sign in with media-server credentials
      tags:
        - auth
  /v1/auth/logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: End the current session
      tags:
        - auth
  /v1/auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Current user, role, and quotas
      tags:
        - auth
  /v1/auth/password:
    post:
      operationId: change-password
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Change your own password
      tags:
        - auth
  /v1/auth/password-recovery/preview:
    post:
      operationId: preview-password-recovery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryBearerInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewPasswordRecoveryOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview a password recovery grant
      tags:
        - auth
  /v1/auth/password-recovery/redeem:
    post:
      operationId: redeem-password-recovery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemPasswordRecoveryInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Set a new local password
      tags:
        - auth
  /v1/auth/password-recovery/request:
    post:
      operationId: request-password-recovery
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordRecoveryInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPasswordRecoveryOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Request local password recovery
      tags:
        - auth
  /v1/auth/sso/callback:
    get:
      description: Public. The provider redirects here; Loomarr verifies the state cookie and the code, mints a session, and redirects onward. §11's allowlist decides access — this route cannot create a user.
      operationId: sso-callback
      responses:
        "200":
          description: OK
        "302":
          description: Redirect back into the app, with a session cookie on success.
          headers:
            Location:
              description: Where to go next
              schema:
                type: string
      summary: Complete an SSO login
      tags:
        - auth
  /v1/auth/sso/start:
    get:
      description: Public — this is how you sign in. Redirects to the identity provider and sets a short-lived state cookie binding the callback to this browser. `next` may be a PATH only; an absolute URL would make this an open redirector.
      operationId: sso-start
      responses:
        "200":
          description: OK
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              description: Where to go next
              schema:
                type: string
      summary: Begin an SSO login
      tags:
        - auth
  /v1/backup:
    get:
      description: Admin only. Makes a new snapshot and streams it without writing it to the backup directory — SQLite installs only (Postgres answers 501; use your usual Postgres tooling).
      operationId: backup-now
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: A SQLite database snapshot.
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Stream a fresh backup
      tags:
        - system
  /v1/channels:
    get:
      operationId: list-channels
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListChannelsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List channels
      tags:
        - channels
    post:
      description: Admin only. From an approved proposal or hand-made.
      operationId: create-channel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a channel
      tags:
        - channels
  /v1/channels/now-next:
    get:
      description: Per channel, the program currently airing and the one after it, read from the backend that streams that channel. Internal channels share Loomarr's playout timeline; Tunarr-backed channels use Tunarr's generated guide.
      operationId: channels-now-next
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NowNextOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: What is airing now and next
      tags:
        - channels
  /v1/channels/{id}:
    delete:
      description: Admin only. Detaches by default (§7).
      operationId: delete-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "Hard-delete Loomarr's channel state and any retained managed Tunarr projection (default: detach only, §7)"
          explode: false
          in: query
          name: purge
          schema:
            description: "Hard-delete Loomarr's channel state and any retained managed Tunarr projection (default: detach only, §7)"
            type: boolean
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Remove a channel
      tags:
        - channels
    get:
      operationId: get-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a channel definition + status
      tags:
        - channels
    patch:
      description: Admin only. Partial update of operator-owned fields (name/number/group/strategy), the per-channel programming policy, and pause/resume via status. Renumber is unique-checked (409). Every edit auto-reconciles — there is no manual rebuild.
      operationId: update-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Edit a channel
      tags:
        - channels
  /v1/channels/{id}/cycle:
    get:
      description: "The time-travel cycle preview (§8.1): what this channel would air at `at` (default now), and WHICH curation rule is active then. Runs the SAME pure lineup builder as reconcile — preview and reality cannot disagree — WITHOUT touching Tunarr or the store beyond a read. Makes first-match-by-priority rule resolution legible (\"at Saturday 9am, the Weekend TNG marathon rule is active\"). Read-only, so any authenticated user may call it; `at` may be past or future."
      operationId: preview-channel-cycle
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "RFC3339 wall-clock to preview (default: now). May be past or future — 'what airs next Christmas morning?'"
          explode: false
          in: query
          name: at
          schema:
            description: "RFC3339 wall-clock to preview (default: now). May be past or future — 'what airs next Christmas morning?'"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewCycleOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview what airs at a chosen time (curation rules)
      tags:
        - channels
  /v1/channels/{id}/filler/coverage:
    get:
      description: Which rung of the §10 fallback ladder this channel's breaks would draw from, and how much material each rung holds. Computed from the SAME ladder reconcile uses (internal/filler), through the same per-channel selection as the pod preview — so the meter and the pods cannot disagree. Read-only, so any authenticated user may call it. A rung the channel's policy skips is ABSENT rather than zero, and `total` is the widest rung rather than a sum (the rungs nest).
      operationId: channel-filler-coverage
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: How well the catalog covers this channel's breaks
      tags:
        - channels
        - filler
  /v1/channels/{id}/icon:
    post:
      description: Admin only. A raster image under 2 MB in the `file` field (PNG, JPEG, WebP, GIF — SVG is refused because the serve half is public and an SVG can carry script). Ingests the bytes into the image service (§22), points the channel's logo at the content-addressed URL, and reconciles so Tunarr picks it up. Re-uploading the same image yields the same URL; a different image yields a different one, so no cache-bust is needed.
      operationId: upload-channel-icon
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      requestBody:
        content:
          multipart/form-data:
            encoding:
              file:
                contentType: image/png,image/jpeg,image/webp,image/gif
            schema:
              properties:
                file:
                  contentEncoding: binary
                  contentMediaType: application/octet-stream
                  description: The icon image. Raster only, under 2 MB — SVG is refused.
                  format: binary
                  type: string
              required:
                - file
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIconOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Upload a channel icon
      tags:
        - channels
  /v1/channels/{id}/icon-suggestions:
    get:
      description: Candidate poster images drawn from the channel's OWN lineup titles (§icon) — a Star Trek channel offers its five series' posters. Read-only, so any authenticated user may call it. 501 when TMDB isn't configured.
      operationId: channel-icon-suggestions
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IconSuggestionsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Suggest channel icons from the lineup
      tags:
        - channels
  /v1/channels/{id}/play-url:
    post:
      description: Any signed-in user. Returns a short-lived, signed HLS URL the in-app player (or a native app) loads directly — the device playout token never reaches the client (§9.1, §11). The URL is scoped to this channel and expires; request a fresh one when it lapses. `quality` picks a per-viewer tier (auto/720p/480p) — the only per-viewer control, since one encoder serves every viewer of a channel.
      operationId: channel-play-url
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
        - explode: false
          in: query
          name: quality
          schema:
            enum:
              - auto
              - "720"
              - "480"
            examples:
              - auto
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProfileBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayURLOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Mint a signed URL to watch this channel in the browser
      tags:
        - channels
  /v1/channels/{id}/pods:
    get:
      description: Assembles the channel's SAVED filler pool WITHOUT touching Tunarr (§10, §12). Same code path and same seed as reconcile, so what you see is what the channel gets. Read-only, so any authenticated user may call it.
      operationId: preview-channel-pods
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodPoolDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview the commercial pool this channel would get
      tags:
        - channels
        - filler
  /v1/channels/{id}/pods/preview:
    post:
      description: Assembles the pool a DRAFT filler selection would produce, without persisting it (§10, §12) — the live sandbox on the channel's Filler section. Same assembler + seed as the saved preview and reconcile, so the sandbox shows exactly what will air once applied. Admin-only (an authoring tool); applying is a normal PATCH of policy.filler.
      operationId: preview-draft-channel-pods
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewDraftPodsInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewDraftPodsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview a draft filler selection without saving it
      tags:
        - channels
        - filler
  /v1/channels/{id}/programming/preview:
    post:
      description: Previews what a DRAFT {lineup?, policy?} would air — the cycle slots (which rule wins at `at`, the rolling window) AND the assembled break pool — WITHOUT saving or touching Tunarr. Runs the same ComputeDesiredAt + pod assembler as reconcile, so the preview cannot drift from what applying it would ship. Omitted lineup/policy fall back to the saved value. Admin-only (an authoring tool).
      operationId: preview-channel-programming
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - description: "RFC3339 wall-clock to preview (default: now). May be past or future."
          explode: false
          in: query
          name: at
          schema:
            description: "RFC3339 wall-clock to preview (default: now). May be past or future."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewProgrammingInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewProgrammingOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Preview an unsaved programming draft
      tags:
        - channels
  /v1/channels/{id}/reconcile:
    post:
      description: Admin only. Rebuilds desired programming on the channel's selected playout backend. Idempotent (§9).
      operationId: reconcile-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Force channel convergence
      tags:
        - channels
  /v1/channels/{id}/refine:
    post:
      description: Admin only. Describe a change; the LLM re-proposes using the channel's current lineup as context, grounded like any suggestion. Returns a jobId — poll /v1/proposals for the proposal, review the diff, and approve to apply (patches THIS channel).
      operationId: refine-channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            examples:
              - ch_abc123
            type: string
      requestBody:
        content:
          application/json:
