name: Android TV beta

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful merge-queue CI run that produced the exact current-main AAB
        required: true
        type: string
      publish_to_play:
        description: Publish through the Play Developer API
        required: true
        default: false
        type: boolean

concurrency:
  group: android-beta-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  release:
    name: Verify, sign, and optionally publish Android TV beta
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: android-beta
    env:
      LOOMARR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      LOOMARR_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      LOOMARR_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      LOOMARR_ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
      ANDROID_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/.artifacts/android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Download and validate the exact CI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/download-android-ci-artifact.sh "${{ inputs.ci_run_id }}" .artifacts/android-ci

      - name: Materialize the upload keystore in runner temp
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ANDROID_UPLOAD_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/loomarr-upload.p12"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "LOOMARR_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Sign and verify without rebuilding
        run: |
          set -euo pipefail
          unsigned=$(find .artifacts/android-ci -maxdepth 1 -type f -name '*-unsigned.aab' -print -quit)
          manifest=${unsigned%.aab}.json
          ./scripts/sign-android-ci-artifact.sh "$unsigned" "$manifest" "$ANDROID_RELEASE_OUTPUT_DIR"

      - name: Retain the signed AAB and release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: loomarr-android-tv-${{ github.sha }}
          path: .artifacts/android-release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the protected Play testing track
        if: inputs.publish_to_play
        env:
          ANDROID_RELEASE_TRACK: internal
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          service_account="$RUNNER_TEMP/google-play-service-account.json"
          test -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$service_account"
          aab=$(find "$ANDROID_RELEASE_OUTPUT_DIR" -maxdepth 1 -type f -name '*.aab' -print -quit)
          manifest=${aab%.aab}.json
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH="$service_account" \
            ./scripts/publish-android-beta.sh "$aab" "$manifest"

      - name: Remove credential files
        if: always()
        run: rm -f -- "${LOOMARR_ANDROID_KEYSTORE_PATH:-}" "$RUNNER_TEMP/google-play-service-account.json"
