# Loomarr deployment compose (design §16). Traefik is the only published HTTP
# port; Loomarr publishes only its UDP LAN-discovery responder and stays on the
# private edge network for application traffic. Profiles: sqlite · postgres · ai.
# Filler ingest needs no profile and no tag: the vendored yt-dlp + ffmpeg ship in the one
# published image, so downloading clips in-app works out of the box. (This used to name a
# loomarr:filler tag; that variant no longer exists — see §16.)
#
#   docker compose -f docker/compose.yaml --profile sqlite up -d
#   docker compose -f docker/compose.yaml -f docker/compose.postgres.yaml --profile postgres up -d
#
# The `ai` profile is orthogonal — ADD it to run a local Ollama (the default
# LLM_PROVIDER points at http://ollama:11434). Skip it for a hosted/external LLM:
#   docker compose -f docker/compose.yaml --profile sqlite --profile ai up -d
#
# The `ai` profile starts Ollama ready-to-use but WITHOUT a model — model choice is the
# setup wizard's job (design §8.1: the right model depends on your GPU). Two knobs:
#   • Fast local inference (NVIDIA + nvidia-container-toolkit): add the GPU overlay —
#       docker compose -f docker/compose.yaml -f docker/compose.gpu.yaml \
#         --profile sqlite --profile ai up -d
#   • Zero-touch (preload a model, skip the wizard's AI step): set LLM_MODEL, e.g.
#       LLM_MODEL=qwen3:8b docker compose -f docker/compose.yaml --profile sqlite --profile ai up -d
#     Left unset, the wizard picks the model — the design default.
#
# For local dev dependencies (a persistent Tunarr wired to Emby) see compose.dev.yaml.

services:
  # Fail before starting the app when the requested artifact is a mutable alias
  # or malformed tag. The validator is also the release workflow's OCI policy,
  # so installation and publication cannot drift into different definitions of
  # an exact beta version.
  loomarr-version-check:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command:
      - sh
      - /check-release-tag.sh
      - --image-tag
      - ${LOOMARR_VERSION:?Pin an exact released Loomarr SemVer version}
    volumes:
      - ../scripts/check-release-tag.sh:/check-release-tag.sh:ro

  # ---- edge: the compiled app is always reached through Traefik ----
  # This is a deliberately dedicated HTTP edge for the beta. It health-checks
  # Loomarr and owns the host port, but one Loomarr replica remains the supported
  # topology until shared jobs, schedulers, playout, and file state pass the scale
  # investigation archived in docs/engineering/archive/first-beta-readiness.md.
  traefik:
    image: traefik:v3.7.1@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    command:
      - --api.dashboard=false
      - --entrypoints.web.address=:8080
      - --entrypoints.health.address=:8082
      - --ping=true
      - --ping.entrypoint=health
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.constraints=Label(`media.loomarr.edge`,`true`)
    ports: ["${LOOMARR_HTTP_BIND:-0.0.0.0}:${LOOMARR_HTTP_PORT:-8080}:8080"]
    volumes:
      # The Docker provider discovers only explicitly-labelled services. The
      # socket is still host control-plane access even when mounted read-only;
      # run this stack only on a trusted Docker host.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      # Probe the unexposed health entrypoint directly. `traefik healthcheck`
      # reloads static config in a new process and does not inherit this
      # container's CLI arguments, so it otherwise probes the public listener.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  # ---- sqlite profile: chown the fresh /data volume for the nonroot image (uid 65532) ----
  # A new named volume is root-owned; the Debian nonroot binary can't create
  # /data/loomarr.db without this one-shot chown. sqlite-only (postgres has no /data).
  loomarr-init:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    profiles: ["sqlite"]
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes: ["loomarr-data:/data"]

  loomarr:
    # Releases live in GHCR. Pin LOOMARR_VERSION for beta installs and rollbacks;
    # `latest` is reserved for stable releases and never moves on a prerelease tag.
    image: ghcr.io/loomarr/loomarr:${LOOMARR_VERSION:?Pin a released Loomarr version}
    depends_on:
      loomarr-version-check:
        condition: service_completed_successfully
      loomarr-init:
        condition: service_completed_successfully # sqlite profile; skipped when absent
        required: false                           # postgres profile has no init
      # ai profile: wait for Ollama to be ready (and any opt-in preload to finish) before
      # loomarr's first probe — so the AI settings/wizard never open on a transient "host
      # unreachable". required:false so a hosted/external-LLM deploy (no ai profile) skips it.
      ollama:
        condition: service_healthy
        required: false
      ollama-pull:
        condition: service_completed_successfully
        required: false
    environment:
      # DATABASE_URL is deliberately absent here. The binary's bootstrap default
      # selects sqlite:///data/loomarr.db without pinning the key, so the in-app
      # SQLite→Postgres migration can persist its target and restart onto it. The
      # Postgres deployment overlay supplies an explicit URL for fresh PG installs.
      LIBRARY_FLAVOR: ${LIBRARY_FLAVOR}
      LIBRARY_URL: ${LIBRARY_URL}
      LIBRARY_TOKEN: ${LIBRARY_TOKEN}
      SEERR_URL: ${SEERR_URL}
      SEERR_API_KEY: ${SEERR_API_KEY}
      TUNARR_URL: ${TUNARR_URL}
      # Tunarr requires channel.transcodeConfigId to be a valid UUID on create
      # (1.3.8: empty ⇒ 400 "Invalid UUID"). Point at a Tunarr transcode config id.
      TUNARR_TRANSCODE_CONFIG_ID: ${TUNARR_TRANSCODE_CONFIG_ID:-}
      API_TOKEN: ${API_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_URL: ${LLM_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY}
      # Filler (§10): empty uses the registry default /data/filler, already carried by
      # loomarr-data below. Set FILLER_DIR only when an additional bind mount makes that
      # absolute in-container path visible. A Tunarr-backed install must mount the same
      # bytes at that same path inside Tunarr; internal playout needs no second mount.
      FILLER_DIR: ${FILLER_DIR:-}
      FILLER_BREAKS_PER_HOUR: ${FILLER_BREAKS_PER_HOUR:-}
      # Loomarr's own address as your media server and Tunarr reach it (§9.1, §15).
      # REQUIRED for internal playout: every stream URL is built from this base, and
      # ffmpeg — a separate process fetching the playlist itself — has no notion of
      # "the origin this came from", so there is no relative fallback. A wrong value
      # means channels appear in the guide and never play.
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:?Set SERVER_PUBLIC_URL to the Traefik URL your media server can reach}
      # Internal playout (§9.1). Defaults are deliberate: `internal` is the default
      # backend, and an empty encoder means "use the best one the transcode check
      # found". Set PLAYOUT_ENCODER only to override that choice.
      PLAYOUT_BACKEND: ${PLAYOUT_BACKEND:-internal}
      PLAYOUT_ENCODER: ${PLAYOUT_ENCODER:-}
      PLAYOUT_MAX_CHANNELS: ${PLAYOUT_MAX_CHANNELS:-}
      PLAYOUT_QUALITY_TIER: ${PLAYOUT_QUALITY_TIER:-}
      # Which DRM render node the encoder probes. Empty ⇒ /dev/dri/renderD128. Set this on a
      # MULTI-GPU host (a discrete Intel Arc alongside an iGPU, or an Arc next to NVIDIA) where the
      # card you want is renderD129 or higher — see docs/install/hardware.md.
      PLAYOUT_RENDER_NODE: ${PLAYOUT_RENDER_NODE:-}
      AUTO_MIGRATE: "true"
    expose: ["8080"]
    # Container multicast does not reach the household LAN. This fixed UDP port carries only
    # bounded discovery requests and unicast responses; HTTP still enters through Traefik.
    ports: ["51029:51029/udp"]
    volumes:
      # ⚠ THE DATABASE LIVES HERE. DATABASE_URL defaults to sqlite:///data/loomarr.db,
      # so without this mount SQLite writes into the container's own writable layer and
      # the install — admin account, channels, settings, secrets — is destroyed by the
      # next `up --force-recreate` or image pull. It is declared and chowned by
      # loomarr-init below, and for a long time was attached to NOTHING: this file
      # carried a "sqlite profile: just loomarr + a /data volume" comment with no
      # volume under it. Named volumes are harmless on the postgres profile (loomarr
      # simply does not write there), so this is unconditional rather than profiled —
      # a mount that is wrong to omit should not depend on remembering a flag.
      - loomarr-data:/data
    # GPU render nodes for hardware encoding (§9.1). /dev/dri is the KMS/DRM interface
    # every Linux hardware encoder reaches through — VAAPI (Intel + AMD), QSV, and Vulkan
    # all need it. VENDOR-NEUTRAL: one device, every GPU.
    #
    # Optional by construction. `device_cgroup_rules` + a bind of /dev/dri would FAIL the
    # whole stack on a host with no GPU, so this uses the `devices:` long syntax guarded by
    # an env default — set PLAYOUT_RENDER_DEVICE=/dev/dri to enable, leave it unset and the
    # container starts fine and encodes in software. The capability probe then reports
    # exactly which families work, so "did my GPU get picked up?" is answerable from the log.
    #
    # ⚠ NVIDIA does NOT use this path: NVENC comes from the nvidia-container-toolkit, which
    # injects the driver and devices itself. Use compose.nvidia.yaml for that.
    devices:
      - ${PLAYOUT_RENDER_DEVICE:-/dev/null}:${PLAYOUT_RENDER_DEVICE:-/dev/null}
    restart: unless-stopped
    networks: [default, edge]
    labels:
      media.loomarr.edge: "true"
      traefik.enable: "true"
      traefik.docker.network: ${LOOMARR_EDGE_NETWORK:-loomarr-edge}
      traefik.http.routers.loomarr.entrypoints: web
      # This is a dedicated edge, so it intentionally accepts any Host value.
      # SERVER_PUBLIC_URL remains the canonical URL embedded into stream links.
      traefik.http.routers.loomarr.rule: PathPrefix(`/`)
      traefik.http.routers.loomarr.service: loomarr
      traefik.http.services.loomarr.loadbalancer.server.port: "8080"
      traefik.http.services.loomarr.loadbalancer.healthcheck.path: /v1/readyz
      traefik.http.services.loomarr.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.loomarr.loadbalancer.healthcheck.timeout: 3s
    # Readiness via loomarr's own `healthcheck` subcommand, which GETs /v1/readyz on
    # LISTEN_ADDR and exits 0/1. A subcommand rather than curl because the image ships
    # no HTTP client (curl is purged from the debian-slim base to keep the layer lean),
    # and the binary is already there.
    #
    # ⚠ This line invoked the same subcommand for a long time before one existed —
    # main() inspected no os.Args at all. Every interval therefore launched a SECOND
    # full Loomarr, which failed to bind :8080 and exited non-zero, so the container
    # reported `unhealthy` permanently and anything gating on `service_healthy` waited
    # forever. A healthcheck that cannot pass is worse than none: it inverts the signal.
    healthcheck:
      test: ["CMD", "/loomarr", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- postgres profile ----
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: loomarr
      POSTGRES_USER: ${POSTGRES_USER:-loomarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loomarr}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ---- ai profile: local Ollama (skip for a hosted/external LLM) ----
  # LLM_URL defaults to http://ollama:11434, so with --profile ai this "just works" once a
  # model is chosen. Model choice is the WIZARD's job (design §8.1: it depends on the user's
  # GPU) — so we do NOT bake in a model. For a truly zero-touch install, set LLM_MODEL and
  # the ollama-pull one-shot below fetches it on first boot; left empty, the wizard picks.
  ollama:
    image: ollama/ollama:latest@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    profiles: ["ai"]
    volumes: ["ollama:/root/.ollama"]
    restart: unless-stopped
    # Readiness so loomarr waits for the server before its first probe (no transient
    # "AI host unreachable" on first load). `ollama list` exits 0 only once the server is up.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12       # up to ~2min for the server to come up on a cold start
      start_period: 20s

  # ---- ai profile, OPT-IN: preload a model so suggestions work with zero wizard steps ----
  # No-op unless LLM_MODEL is set (empty ⇒ `ollama pull ""` is skipped, exit 0). This keeps
  # the design-default "the user picks the model" intact while making a fully-scripted,
  # model-included deploy a one-env-var opt-in. Runs to completion, then loomarr can start.
  ollama-pull:
    image: ollama/ollama:latest@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-}
    entrypoint: ["/bin/sh", "-c"]
    # Guard on a non-empty tag; pulling is idempotent, so a re-run with the model present
    # is a fast no-op. A pull failure is non-fatal to the stack — the wizard can still pull.
    command:
      - |
        if [ -n "$${LLM_MODEL}" ]; then
          echo "Preloading LLM_MODEL=$${LLM_MODEL} into Ollama…"
          ollama pull "$${LLM_MODEL}"
        else
          echo "LLM_MODEL not set — skipping preload (pick a model in the setup wizard)."
        fi
    restart: "no"

volumes:
  loomarr-data: # sqlite backend
  pg-data: # postgres profile
  ollama: # ai profile

networks:
  edge:
    name: ${LOOMARR_EDGE_NETWORK:-loomarr-edge}
